<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediSync Admin - Reset Password</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #286660;
            --secondary-color: #1e7668;
        }

        body {
            font-family: 'Roboto', system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #f0f2f5 0%, #e9ecef 100%) !important;
            background-size: cover !important;
            background-attachment: fixed !important;
            color: #333;
            margin: 0;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3) 0%, rgba(248, 249, 250, 0.2) 50%, rgba(240, 242, 245, 0.1) 100%);
            z-index: -1;
            pointer-events: none;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 0 8px 16px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #286660, #6ca299, #b8d2ce);
            border-radius: 16px 16px 0 0;
        }

        h2 {
            margin: 0 0 10px 0;
            text-align: center;
        }

        p {
            margin: 0 0 20px 0;
            text-align: center;
            color: #666;
        }

        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }

        .alert.error {
            background: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 2px rgba(30, 118, 104, 0.2);
        }

        .btn {
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            background: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .footer {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }

        .link {
            color: var(--secondary-color);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="card">
            <h2>Reset Password</h2>
            <p>Set a new password for your admin account.</p>

            <div id="alert" class="alert"></div>

            <form id="resetForm">
                <label for="new_password">New Password</label>
                <input id="new_password" name="new_password" type="password" required placeholder="Enter new password" />

                <label for="new_password_confirm" style="margin-top: 12px;">Confirm New Password</label>
                <input id="new_password_confirm" name="new_password_confirm" type="password" required placeholder="Confirm new password" />

                <button id="submitBtn" type="submit" class="btn">Reset Password</button>
            </form>

            <div class="footer">
                <a class="link" href="index.html">Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = (function () {
            try {
                const params = new URLSearchParams(window.location.search || '');
                const fromQuery = params.get('admin_api_base_url') || params.get('api') || params.get('adminApi');
                if (fromQuery) {
                    const normalized = fromQuery.endsWith('/') ? fromQuery.slice(0, -1) : fromQuery;
                    try { localStorage.setItem('admin_api_base_url', normalized); } catch (_) {}
                }
                const fromStorage = (typeof localStorage !== 'undefined') ? localStorage.getItem('admin_api_base_url') : null;
                const base = fromQuery || fromStorage || 'http://localhost:8000/admin';
                return base.endsWith('/') ? base.slice(0, -1) : base;
            } catch (_) {
                return 'http://localhost:8000/admin';
            }
        })();

        let csrfToken = null;

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert ${type}`;
            alert.style.display = 'block';
        }

        async function getCSRFToken() {
            if (csrfToken) return csrfToken;
            try {
                const response = await fetch(`${API_BASE_URL}/csrf-token/`, { method: 'GET', credentials: 'include' });
                if (response.ok) {
                    const data = await response.json();
                    csrfToken = data.csrf_token;
                    return csrfToken;
                }
            } catch (_) {}
            return null;
        }

        function getTokenFromUrl() {
            const params = new URLSearchParams(window.location.search || '');
            return (params.get('token') || '').trim();
        }

        const resetToken = getTokenFromUrl();
        if (!resetToken) {
            showAlert('Missing reset token. Please use the link from your email.', 'error');
            document.getElementById('submitBtn').disabled = true;
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;

            const new_password = (document.getElementById('new_password').value || '').trim();
            const new_password_confirm = (document.getElementById('new_password_confirm').value || '').trim();

            if (!new_password || !new_password_confirm) {
                showAlert('Please enter your new password and confirmation.', 'error');
                btn.disabled = false;
                return;
            }

            try {
                const csrf = await getCSRFToken();
                const headers = { 'Content-Type': 'application/json' };
                if (csrf) headers['X-CSRFToken'] = csrf;

                const resp = await fetch(`${API_BASE_URL}/password-reset/confirm/`, {
                    method: 'POST',
                    credentials: 'include',
                    headers,
                    body: JSON.stringify({ token: resetToken, new_password, new_password_confirm })
                });

                const contentType = (resp.headers.get('content-type') || '').toLowerCase();
                const data = contentType.includes('application/json') ? await resp.json() : { error: await resp.text() };

                if (resp.ok) {
                    showAlert(data.message || 'Password reset successful. You can now sign in.', 'success');
                } else {
                    const msg = data.error || data.message || `Reset failed (HTTP ${resp.status}).`;
                    showAlert(msg, 'error');
                }
            } catch (_) {
                showAlert('Network error. Please try again.', 'error');
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
